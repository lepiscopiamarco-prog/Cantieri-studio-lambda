function doConnectFirebase(){
  const raw=(document.getElementById('fb_config_input')?.value||'').trim();
  const dbUrl=(document.getElementById('fb_dburl_input')?.value||'').trim();
  if(!raw){ showToast('Incolla prima la configurazione Firebase','error'); return; }
  if(!dbUrl){ showToast('Inserisci l\'URL del Realtime Database','error'); return; }
  let cfg;
  try{
    // Pulizia: rimuovi "const firebaseConfig = " e ";" se presenti
    let clean=raw.replace(/^\s*const\s+\w+\s*=\s*/,'').replace(/;\s*$/,'').trim();
    // Converti da JS object literal a JSON se necessario
    clean=clean.replace(/([{,]\s*)([a-zA-Z_][a-zA-Z0-9_]*)\s*:/g,'$1"$2":');
    cfg=JSON.parse(clean);
  }catch(e){
    showToast('Formato non valido. Controlla il testo incollato.','error');
    addLog('❌ Formato configurazione non valido: '+e.message,'err');
    return;
  }
  if(!cfg.projectId||!cfg.apiKey){ showToast('Manca projectId o apiKey nella configurazione','error'); return; }
  // Inietta databaseURL nel config
  cfg.databaseURL = dbUrl;
  connectFirebase(cfg);
}

function doDisconnectFirebase(){
  clearFbConfig();
  addLog('🔌 Disconnesso da Firebase.','warn');
  showToast('Disconnesso','info');
  render();
}

function doReconnectFirebase(){
  const cfg=loadFbConfig();
  if(cfg) connectFirebase(cfg);
}

function exportToExcel(){
  if(typeof XLSX==='undefined'){
    showToast('Libreria Excel non caricata. Controlla la connessione.','error');
    return;
  }

  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const futuro=new Date(oggi); futuro.setMonth(futuro.getMonth()+6);
  const totGgLav=countWorkingDays(oggi,futuro);
  const wb=XLSX.utils.book_new();
  const dataStr=new Date().toLocaleDateString('it-IT');

  // ── Stili colori header (solo xlsx supporta wscols, non stili inline in SheetJS CE)
  // Usiamo !cols per larghezze e cell comments per intestazioni descrittive

  // ── FOGLIO 1: RIEPILOGO ────────────────────────────────────
  const cantieriAttivi=Object.values(STATE).filter(c=>c.stato==='attivo').length;
  const allocAttive=RISORSE.allocazioni.filter(a=>{
    const al=a.al?new Date(a.al):null; return !al||al>=oggi;
  }).length;
  const persOccupate=new Set(
    RISORSE.allocazioni.filter(a=>{const al=a.al?new Date(a.al):null;return !al||al>=oggi;}).map(a=>a.personaId)
  ).size;

  const riepilogo=[
    ['Studio Lambda – Esportazione Dati Cantieri','','',''],
    ['Data esportazione:', dataStr,'',''],
    ['','','',''],
    ['RIEPILOGO GENERALE','','',''],
    ['Indicatore','Valore','',''],
    ['Totale cantieri',Object.keys(STATE).length,'',''],
    ['Cantieri attivi',cantieriAttivi,'',''],
    ['Personale registrato',RISORSE.persone.length,'',''],
    ['Allocazioni totali',RISORSE.allocazioni.length,'',''],
    ['Allocazioni attive',allocAttive,'',''],
    ['Persone attualmente occupate',persOccupate,'',''],
    ['Giorni lavorativi disponibili (prossimi 6 mesi)',totGgLav,'',''],
    ['','','',''],
    ['Nota: i giorni lavorativi escludono sabato, domenica e festività nazionali italiane.','','',''],
  ];
  const wsRiep=XLSX.utils.aoa_to_sheet(riepilogo);
  wsRiep['!cols']=[{wch:48},{wch:18},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb,wsRiep,'Riepilogo');

  // ── FOGLIO 2: CANTIERI ─────────────────────────────────────
  const cantieriHeader=[
    'ID','Nome Cantiere','Luogo','Città','Stato',
    'Data Inizio','Durata Lavori','Responsabile Lavori',
    'CSE Nome','CSE Cognome','RSPP Nome',
    'Committente','Impresa Esecutrice','Note'
  ];
  const cantieriRows=Object.values(STATE).map(c=>{
    const rl=c.rl||{}; const cse=c.cse||{}; const rspp=c.rspp||{};
    return [
      c.id||'', c.nome||'', c.luogo||'', c.citta||'',
      c.stato||'', c.dataInizio||'', c.durataLavori||'',
      (rl.nome||''),
      (cse.nome||''), (cse.cognome||''),
      (rspp.nome||''),
      c.committente||'', c.impresaEsecutrice||'', c.note||''
    ];
  });
  const wsCantieri=XLSX.utils.aoa_to_sheet([cantieriHeader,...cantieriRows]);
  wsCantieri['!cols']=[
    {wch:20},{wch:32},{wch:22},{wch:18},{wch:12},
    {wch:14},{wch:18},{wch:24},
    {wch:18},{wch:18},{wch:18},
    {wch:24},{wch:28},{wch:30}
  ];
  XLSX.utils.book_append_sheet(wb,wsCantieri,'Cantieri');

  // ── FOGLIO 3: PERSONALE ────────────────────────────────────
  const personeHeader=[
    'ID','Nome','Cognome','Qualifica / Ruolo',
    'Email','Note',
    'Allocazioni totali','Allocazioni attive',
    'GG Lavorativi occupati (6 mesi)','GG Lavorativi disponibili (6 mesi)',
    'Saturazione %'
  ];
  const personeRows=RISORSE.persone.map(p=>{
    const myAllocs=RISORSE.allocazioni.filter(a=>a.personaId===p.id);
    const myAllocsAttive=myAllocs.filter(a=>{const al=a.al?new Date(a.al):null;return !al||al>=oggi;});
    const ggOcc=myAllocs.reduce((s,a)=>s+workingDaysInRange(a.dal,a.al,oggi,futuro),0);
    const ggDisp=Math.max(0,totGgLav-ggOcc);
    const pct=Math.round(ggOcc/totGgLav*100);
    return [
      p.id||'', p.nome||'', p.cognome||'', p.qualifica||'',
      p.email||'', p.note||'',
      myAllocs.length, myAllocsAttive.length,
      ggOcc, ggDisp, pct
    ];
  });
  const wsPersone=XLSX.utils.aoa_to_sheet([personeHeader,...personeRows]);
  wsPersone['!cols']=[
    {wch:20},{wch:18},{wch:18},{wch:22},
    {wch:26},{wch:24},
    {wch:18},{wch:16},
    {wch:28},{wch:30},{wch:14}
  ];
  XLSX.utils.book_append_sheet(wb,wsPersone,'Personale');

  // ── FOGLIO 4: ALLOCAZIONI ─────────────────────────────────
  const allocHeader=[
    'ID Allocazione','Persona','Qualifica Persona',
    'Cantiere','Luogo Cantiere',
    'Ruolo nel Cantiere',
    'Data Inizio','Data Fine','Fine Aperta',
    'GG Lavorativi Totali','GG Lavorativi Rimanenti',
    'Stato','Note'
  ];
  const allocRows=RISORSE.allocazioni.map(a=>{
    const p=RISORSE.persone.find(x=>x.id===a.personaId)||{};
    const c=STATE[a.cantiereId]||{};
    const al=a.al?new Date(a.al):null;
    const dal=a.dal?new Date(a.dal):oggi;
    const fineAperta=!a.al?'Sì':'No';
    let stato='';
    if(!al){ stato='In corso (aperta)'; }
    else if(al<oggi){ stato='Conclusa'; }
    else if(dal>oggi){ stato='Futura'; }
    else { stato='Attiva'; }
    // GG lavorativi totali dell'allocazione (dall'inizio, non da oggi)
    const ggTot=countWorkingDays(dal, al||futuro);
    // GG lavorativi rimanenti (da oggi a fine)
    const ggRim=workingDaysInRange(a.dal,a.al,oggi,futuro);
    return [
      a.id||'',
      (p.nome||'')+(p.cognome?' '+p.cognome:''),
      p.qualifica||'',
      c.nome||'', c.luogo||'',
      a.ruolo||'',
      a.dal||'', a.al||'', fineAperta,
      ggTot, ggRim,
      stato, a.note||''
    ];
  });
  const wsAlloc=XLSX.utils.aoa_to_sheet([allocHeader,...allocRows]);
  wsAlloc['!cols']=[
    {wch:22},{wch:24},{wch:22},
    {wch:28},{wch:20},
    {wch:22},
    {wch:14},{wch:14},{wch:12},
    {wch:20},{wch:22},
    {wch:20},{wch:28}
  ];
  XLSX.utils.book_append_sheet(wb,wsAlloc,'Allocazioni');

  // ── FOGLIO 5: SATURAZIONE PER CANTIERE ───────────────────
  const satHeader=[
    'Cantiere','Stato','N. Persone Allocate','Ruoli presenti',
    'GG Lavorativi totali allocati','Persona più occupata','Saturazione max %'
  ];
  const satRows=Object.values(STATE).map(c=>{
    const cAllocs=RISORSE.allocazioni.filter(a=>a.cantiereId===c.id);
    const personeUniche=new Set(cAllocs.map(a=>a.personaId));
    const ruoli=[...new Set(cAllocs.map(a=>a.ruolo).filter(Boolean))].join(', ');
    let ggMax=0; let personaMax='–';
    cAllocs.forEach(a=>{
      const gg=workingDaysInRange(a.dal,a.al,oggi,futuro);
      if(gg>ggMax){
        ggMax=gg;
        const p=RISORSE.persone.find(x=>x.id===a.personaId);
        personaMax=p?(p.nome+' '+(p.cognome||'')).trim():'–';
      }
    });
    const ggTotCantiere=cAllocs.reduce((s,a)=>s+workingDaysInRange(a.dal,a.al,oggi,futuro),0);
    const satMax=Math.round(ggMax/totGgLav*100);
    return [
      c.nome||'', c.stato||'',
      personeUniche.size, ruoli,
      ggTotCantiere, personaMax, satMax
    ];
  });
  const wsSat=XLSX.utils.aoa_to_sheet([satHeader,...satRows]);
  wsSat['!cols']=[
    {wch:30},{wch:12},{wch:20},{wch:34},
    {wch:26},{wch:26},{wch:16}
  ];
  XLSX.utils.book_append_sheet(wb,wsSat,'Saturazione per Cantiere');

  // ── DOWNLOAD ──────────────────────────────────────────────
  const nomefile=`StudioLambda_Cantieri_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, nomefile);
  showToast('Export Excel completato ✓','success');
}
