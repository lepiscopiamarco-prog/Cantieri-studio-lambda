<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Lambda – Gestione Cantieri P.Q_02.05</title>
<!-- Firebase SDK (compat v9 – caricato dinamicamente quando config è disponibile) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap');
:root {
  --purple: #5e2670;
  --purple-light: #7a3490;
  --purple-dark: #3d1a4a;
  --orange: #e07020;
  --orange-light: #f08030;
  --bg: #f0ede8;
  --card: #ffffff;
  --text: #2a2a2a;
  --text-muted: #6b6b6b;
  --border: #d5cfc6;
  --border-light: #e8e3dc;
  --success: #1a6b2a;
  --danger: #b01010;
  --warning: #c07010;
  --shadow: 0 2px 12px rgba(94,38,112,0.10);
  --shadow-lg: 0 8px 32px rgba(94,38,112,0.16);
  --radius: 8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}

/* TOPBAR */
.topbar{background:var(--purple-dark);color:#fff;padding:0 24px;display:flex;align-items:center;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.topbar-logo{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none}
.topbar-logo img{height:38px;filter:brightness(1.15)}
.topbar-brand{display:flex;flex-direction:column}
.topbar-brand-name{font-family:'Playfair Display',serif;font-size:18px;color:#fff;line-height:1}
.topbar-brand-sub{font-size:10px;color:rgba(255,255,255,0.6);letter-spacing:1px;text-transform:uppercase}
.topbar-spacer{flex:1}
.topbar-doc{color:rgba(255,255,255,0.5);font-size:12px;letter-spacing:0.5px}
.topbar-nav{display:flex;gap:8px}
.topbar-nav button{background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.8);padding:6px 14px;border-radius:4px;cursor:pointer;font-size:13px;transition:all .2s}
.topbar-nav button:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.4)}

/* MAIN LAYOUT */
.main{max-width:1200px;margin:0 auto;padding:28px 20px}

/* BREADCRUMB */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:var(--text-muted)}
.breadcrumb a{color:var(--purple);text-decoration:none;cursor:pointer}.breadcrumb a:hover{text-decoration:underline}
.breadcrumb-sep{color:var(--border)}

/* PAGE TITLE */
.page-title{font-family:'Playfair Display',serif;font-size:28px;color:var(--purple-dark);margin-bottom:6px}
.page-sub{color:var(--text-muted);font-size:14px;margin-bottom:24px}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-light);padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-light)}
.card-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--purple-dark)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-family:'Source Sans 3',sans-serif;font-weight:500;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--purple);color:#fff}.btn-primary:hover{background:var(--purple-light)}
.btn-orange{background:var(--orange);color:#fff}.btn-orange:hover{background:var(--orange-light)}
.btn-outline{background:transparent;color:var(--purple);border:1.5px solid var(--purple)}.btn-outline:hover{background:var(--purple);color:#fff}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 12px;font-size:13px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.form-full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column;gap:5px}
label{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
input,textarea,select{border:1.5px solid var(--border);border-radius:6px;padding:9px 12px;font-size:14px;font-family:'Source Sans 3',sans-serif;color:var(--text);background:#fff;width:100%;transition:border .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(94,38,112,0.08)}
textarea{resize:vertical;min-height:80px}

/* CANTIERE LIST */
.cantiere-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:8px}
.cantiere-card{background:var(--card);border-radius:var(--radius);border:1.5px solid var(--border-light);padding:20px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.cantiere-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.cantiere-code{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--orange);text-transform:uppercase;margin-bottom:4px}
.cantiere-name{font-family:'Playfair Display',serif;font-size:17px;color:var(--purple-dark);margin-bottom:6px}
.cantiere-meta{font-size:13px;color:var(--text-muted);line-height:1.5}
.cantiere-actions{display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light)}
.cantiere-badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
.badge-active{background:#e8f5e9;color:#1a6b2a}
.badge-done{background:#e3e3e3;color:#555}

/* MODULE GROUPS */
.module-groups{display:flex;flex-direction:column;gap:20px}
.module-group-title{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.module-group-title::after{content:'';flex:1;height:1px;background:var(--border-light)}
.module-list{display:flex;flex-direction:column;gap:6px}
.module-item{background:var(--card);border:1.5px solid var(--border-light);border-radius:7px;padding:12px 16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.module-item:hover{border-color:var(--purple);background:#faf7fc}
.module-code{font-size:11px;font-weight:700;color:var(--purple);background:#f3eef8;padding:2px 8px;border-radius:4px;white-space:nowrap}
.module-name{flex:1;font-size:14px;font-weight:500}
.module-count{font-size:12px;color:var(--text-muted);background:var(--bg);padding:2px 8px;border-radius:10px}
.module-chevron{color:var(--text-muted);font-size:16px}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.active{color:var(--purple);border-bottom-color:var(--purple)}
.tab:hover:not(.active){color:var(--text)}

/* MODULE VIEW */
.module-header{background:linear-gradient(135deg,var(--purple-dark) 0%,var(--purple) 100%);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:20px}
.module-header-code{font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;margin-bottom:6px}
.module-header-title{font-family:'Playfair Display',serif;font-size:22px}
.module-header-desc{font-size:13px;color:rgba(255,255,255,0.7);margin-top:6px;line-height:1.5}

/* RECORDS TABLE */
.records-table{width:100%;border-collapse:collapse;margin-top:8px}
.records-table th{background:var(--bg);padding:10px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
.records-table td{padding:10px 12px;border-bottom:1px solid var(--border-light);font-size:14px}
.records-table tr:hover td{background:#faf7fc}

/* SECTION TITLES */
.section-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--purple-dark);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--orange);display:inline-block}

/* ALERT */
.alert{padding:12px 16px;border-radius:6px;font-size:13px;margin-bottom:16px}
.alert-info{background:#e8f0fe;border-left:3px solid #1a73e8;color:#1a4e8e}
.alert-warning{background:#fff3e0;border-left:3px solid var(--orange);color:#8a4a00}

/* DYNAMIC ROWS */
.dynamic-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px}
.dynamic-row-2{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px}
.add-row-btn{color:var(--purple);background:none;border:1.5px dashed var(--purple);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;width:100%;text-align:center;margin-top:6px;transition:all .2s}
.add-row-btn:hover{background:var(--purple);color:#fff}

/* CHECKLIST */
.checklist-group{margin-bottom:20px}
.checklist-group-title{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.5px}
.checklist-item{display:grid;grid-template-columns:40px 1fr 100px 100px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.checklist-item:last-child{border-bottom:none}
.checklist-item-code{font-weight:700;color:var(--text-muted)}
.checklist-item-desc{line-height:1.4}
.checklist-select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;cursor:pointer}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted)}
.empty-state-icon{font-size:48px;margin-bottom:12px}
.empty-state-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--purple-dark);margin-bottom:8px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--purple-dark)}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted);line-height:1}.modal-close:hover{color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* SPLIT LAYOUT */
.split{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.sidebar-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-light);position:sticky;top:80px}
.sidebar-section{padding:14px 16px;border-bottom:1px solid var(--border-light)}
.sidebar-section:last-child{border-bottom:none}
.sidebar-section-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:13px;transition:all .15s;color:var(--text)}
.sidebar-item:hover{background:#f3eef8;color:var(--purple)}
.sidebar-item.active{background:var(--purple);color:#fff}
.sidebar-item-icon{font-size:15px;width:20px;text-align:center}

/* PRINT PREVIEW */
.doc-preview{border:1px solid var(--border);border-radius:6px;padding:32px;background:#fff;font-size:12px;line-height:1.6;max-height:400px;overflow-y:auto}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOOLTIP */
.tooltip{position:relative}
.tooltip-text{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;margin-bottom:4px}
.tooltip:hover .tooltip-text{opacity:1}

/* PROGRESS BAR */
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--orange));border-radius:2px;transition:width .3s}

/* STATUS TAGS */
.status-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status-ok{background:#e8f5e9;color:#1a6b2a}
.status-warn{background:#fff8e1;color:#c07010}
.status-err{background:#ffebee;color:#b01010}
.status-na{background:#f5f5f5;color:#888}

/* UTILITY */
.flex{display:flex}.flex-center{align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mb-16{margin-bottom:16px}
.text-right{text-align:right}.text-center{text-align:center}
.text-sm{font-size:13px}.text-muted{color:var(--text-muted)}
.font-bold{font-weight:700}
.hidden{display:none!important}

/* RESPONSIVE */
@media(max-width:768px){
  .form-grid,.form-grid-3{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .sidebar-card{position:static}
  .checklist-item{grid-template-columns:1fr}
  .topbar-doc{display:none}
}

/* ====== RISORSE / PIANIFICAZIONE ====== */
.risorse-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.risorse-main{display:flex;flex-direction:column;gap:20px}

/* KPI STRIP */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border-light);padding:18px 20px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.kpi-value{font-family:'Playfair Display',serif;font-size:28px;color:var(--purple-dark);line-height:1}
.kpi-sub{font-size:12px;color:var(--text-muted);margin-top:4px}

/* ALLOCATION TABLE */
.alloc-table{width:100%;border-collapse:collapse}
.alloc-table th{background:var(--purple-dark);color:#fff;padding:10px 14px;text-align:left;font-size:12px;font-weight:600;letter-spacing:.5px}
.alloc-table td{padding:10px 14px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle}
.alloc-table tr:hover td{background:#faf7fc}
.alloc-table .role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#f3eef8;color:var(--purple)}
.alloc-table .person-name{font-weight:600;color:var(--text)}
.alloc-table .site-name{color:var(--purple-dark);font-weight:500}
.date-range{font-size:12px;color:var(--text-muted)}
.avail-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600}
.avail-yes{background:#e8f5e9;color:#1a6b2a}
.avail-no{background:#ffebee;color:#b01010}
.avail-partial{background:#fff8e1;color:#c07010}

/* GANTT */
.gantt-wrap{overflow-x:auto}
.gantt-svg{display:block}

/* BAR CHART */
.chart-bars{display:flex;flex-direction:column;gap:10px}
.chart-bar-row{display:flex;align-items:center;gap:10px}
.chart-bar-label{font-size:12px;color:var(--text);width:130px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.chart-bar-track{flex:1;height:20px;background:var(--border-light);border-radius:4px;overflow:hidden;position:relative}
.chart-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--purple),var(--orange));transition:width .4s}
.chart-bar-val{position:absolute;right:6px;top:2px;font-size:11px;font-weight:700;color:#fff}

/* PERSON CARDS */
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person-card{background:var(--card);border:1.5px solid var(--border-light);border-radius:var(--radius);padding:16px;transition:all .2s;box-shadow:var(--shadow)}
.person-card:hover{border-color:var(--purple);transform:translateY(-1px)}
.person-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--purple-dark),var(--orange));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.person-info{flex:1;min-width:0}
.person-nome{font-weight:700;font-size:14px;color:var(--text)}
.person-qualifica{font-size:12px;color:var(--text-muted);margin-top:2px}
.person-alloc-count{font-size:11px;background:#f3eef8;color:var(--purple);padding:2px 8px;border-radius:10px;font-weight:700}

/* AI CHAT PANEL */
.chat-panel{background:var(--card);border-radius:var(--radius);border:1px solid var(--border-light);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;height:580px;position:sticky;top:80px}
.chat-header{padding:14px 16px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--purple-dark),var(--purple));border-radius:var(--radius) var(--radius) 0 0}
.chat-header-icon{font-size:20px}
.chat-header-title{color:#fff;font-family:'Playfair Display',serif;font-size:15px}
.chat-header-sub{color:rgba(255,255,255,.6);font-size:11px}
.chat-header-key{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;white-space:nowrap}
.chat-header-key:hover{background:rgba(255,255,255,.25)}
.chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.chat-msg{max-width:90%;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.chat-msg.user{background:var(--purple);color:#fff;align-self:flex-end;border-radius:10px 10px 2px 10px}
.chat-msg.bot{background:#f3eef8;color:var(--text);align-self:flex-start;border-radius:10px 10px 10px 2px;border:1px solid var(--border-light)}
.chat-msg.bot.thinking{opacity:.6;font-style:italic}
.chat-msg strong{font-weight:700}
.chat-input-area{padding:12px;border-top:1px solid var(--border-light);display:flex;gap:8px;align-items:flex-end}
.chat-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Source Sans 3',sans-serif;resize:none;min-height:40px;max-height:100px}
.chat-input:focus{outline:none;border-color:var(--purple)}
.chat-send{background:var(--purple);color:#fff;border:none;border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:16px;flex-shrink:0;transition:all .2s}
.chat-send:hover{background:var(--purple-light)}
.chat-send:disabled{opacity:.4;cursor:not-allowed}
.no-key-msg{padding:16px;text-align:center;color:var(--text-muted);font-size:13px}

/* API KEY SETTINGS */
.settings-box{background:linear-gradient(135deg,#faf7fc,#f3eef8);border:1.5px solid var(--border-light);border-radius:var(--radius);padding:20px}
.settings-box-title{font-family:'Playfair Display',serif;font-size:16px;color:var(--purple-dark);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.api-key-input{font-family:monospace;font-size:13px;letter-spacing:.5px}
.api-key-status{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:10px;font-size:12px;font-weight:600;margin-top:8px}
.api-key-ok{background:#e8f5e9;color:#1a6b2a}
.api-key-missing{background:#ffebee;color:#b01010}

/* QUICK SUGGESTIONS */
.chat-suggestions{padding:8px 12px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--border-light)}
.chat-sugg-btn{background:#f3eef8;border:1px solid var(--border-light);border-radius:6px;padding:5px 10px;font-size:11px;color:var(--purple);cursor:pointer;text-align:left;transition:all .15s;font-family:'Source Sans 3',sans-serif}
.chat-sugg-btn:hover{background:var(--purple);color:#fff}
.chat-sugg-label{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text-muted);text-transform:uppercase;margin-bottom:2px}

/* CHAT MODE TABS */
.chat-mode-tabs{display:flex;border-bottom:1px solid var(--border-light)}
.chat-mode-tab{flex:1;padding:8px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;background:none;border-left:none;border-right:none;border-top:none;font-family:'Source Sans 3',sans-serif}
.chat-mode-tab.active{color:var(--purple);border-bottom-color:var(--orange)}
.chat-mode-tab:hover:not(.active){color:var(--text);background:#faf7fc}

/* ALLOCATION SUGGESTION FORM */
.alloc-sugg-form{padding:12px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--border-light);background:#faf7fc}
.alloc-sugg-form label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px}
.alloc-sugg-form select,.alloc-sugg-form input{font-size:12px;padding:6px 9px;border:1.5px solid var(--border);border-radius:6px;font-family:'Source Sans 3',sans-serif;background:#fff}
.alloc-sugg-form select:focus,.alloc-sugg-form input:focus{outline:none;border-color:var(--purple)}
.alloc-sugg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ALLOCATION SUGGESTION CARD (AI response) */
.alloc-sugg-card{background:linear-gradient(135deg,#f3eef8,#fdf6ec);border:1.5px solid var(--purple);border-radius:10px;padding:12px;margin-top:6px}
.alloc-sugg-card-title{font-size:12px;font-weight:700;color:var(--purple-dark);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.alloc-sugg-card-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(94,38,112,.1)}
.alloc-sugg-card-row:last-of-type{border-bottom:none}
.alloc-sugg-card-key{color:var(--text-muted);font-weight:500}
.alloc-sugg-card-val{color:var(--text);font-weight:600}
.alloc-sugg-card-btn{width:100%;margin-top:10px;background:var(--purple);color:#fff;border:none;border-radius:6px;padding:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;transition:background .2s}
.alloc-sugg-card-btn:hover{background:var(--purple-light)}

/* RISORSE TABS */
.risorse-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.risorse-tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.risorse-tab.active{color:var(--purple);border-bottom-color:var(--orange)}
.risorse-tab:hover:not(.active){color:var(--text)}

@media(max-width:1024px){
  .risorse-layout{grid-template-columns:1fr}
  .chat-panel{position:static;height:450px}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){.kpi-strip{grid-template-columns:1fr 1fr}}

/* ====== DATABASE / FIREBASE ====== */
.db-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.db-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:24px}
.db-tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.db-tab.active{color:var(--purple);border-bottom-color:var(--orange)}
.db-tab:hover:not(.active){color:var(--text)}
.firebase-status{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600}
.fb-ok{background:#e8f5e9;color:#1a6b2a;border:1.5px solid #a5d6a7}
.fb-err{background:#ffebee;color:#b01010;border:1.5px solid #ef9a9a}
.fb-warn{background:#fff8e1;color:#c07010;border:1.5px solid #ffe082}
.fb-idle{background:#f5f5f5;color:#888;border:1.5px solid #e0e0e0}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0}
.pulse-green{background:#1a6b2a;box-shadow:0 0 0 3px rgba(26,107,42,.2);animation:pulse-anim 2s infinite}
.pulse-red{background:#b01010}
.pulse-grey{background:#bbb}
@keyframes pulse-anim{0%,100%{box-shadow:0 0 0 3px rgba(26,107,42,.2)}50%{box-shadow:0 0 0 6px rgba(26,107,42,.05)}}
.config-textarea{font-family:monospace;font-size:12px;min-height:180px;border:1.5px solid var(--border);border-radius:6px;padding:12px;width:100%;color:var(--text);background:#fafafa;resize:vertical;line-height:1.6}
.config-textarea:focus{outline:none;border-color:var(--purple);background:#fff}
.sync-card{background:var(--card);border-radius:var(--radius);border:1.5px solid var(--border-light);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sync-card-title{font-family:'Playfair Display',serif;font-size:15px;color:var(--purple-dark);display:flex;align-items:center;gap:8px}
.sync-card-desc{font-size:13px;color:var(--text-muted);line-height:1.5}
.sync-card-meta{font-size:11px;color:var(--text-muted);background:var(--bg);padding:6px 10px;border-radius:6px}
.step-guide{counter-reset:step-counter;display:flex;flex-direction:column;gap:0}
.step-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border-light);align-items:flex-start}
.step-item:last-child{border-bottom:none}
.step-num{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:1px}
.step-content{flex:1}
.step-title{font-weight:700;font-size:14px;color:var(--text);margin-bottom:5px}
.step-desc{font-size:13px;color:var(--text-muted);line-height:1.6}
.step-code{font-family:monospace;font-size:11px;background:#f3eef8;border:1px solid #d5cfc6;border-radius:4px;padding:8px 10px;margin-top:8px;color:var(--purple-dark);white-space:pre-wrap;word-break:break-all}
.step-img{background:var(--bg);border:1px dashed var(--border);border-radius:6px;padding:10px 14px;margin-top:8px;font-size:12px;color:var(--text-muted);text-align:center}
.db-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:12px}
.db-legend-item{display:flex;align-items:center;gap:6px}
.sync-log{background:#1a1a2e;border-radius:6px;padding:12px;font-family:monospace;font-size:12px;color:#a0e0a0;min-height:80px;max-height:160px;overflow-y:auto;line-height:1.8}
.sync-log .log-err{color:#ff8080}
.sync-log .log-info{color:#80c0ff}
.sync-log .log-warn{color:#ffd080}
@media(max-width:900px){.db-layout{grid-template-columns:1fr}}

/* ====== AUTH / LOGIN ====== */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,var(--purple-dark) 0%,#1a0a2e 100%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;border-radius:16px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,0.4);overflow:hidden}
.auth-header{background:linear-gradient(135deg,var(--purple-dark),var(--purple));padding:32px 32px 24px;text-align:center}
.auth-logo{font-family:'Playfair Display',serif;font-size:26px;color:#fff;margin-bottom:4px}
.auth-sub{font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:1px;text-transform:uppercase}
.auth-body{padding:32px}
.auth-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--purple-dark);margin-bottom:20px;text-align:center}
.auth-error{background:#ffebee;border-left:3px solid var(--danger);color:#b01010;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px}
.auth-btn{width:100%;padding:12px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:15px;font-family:'Source Sans 3',sans-serif;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.auth-btn:hover{background:var(--purple-light)}

/* ── TOPBAR DROPDOWN NAV ── */
.nav-dd{position:relative;display:inline-flex}

/* trigger button */
.nav-dd-trigger{
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .18s;white-space:nowrap;letter-spacing:.2px;
  font-family:'Source Sans 3',sans-serif;
}
.nav-dd-trigger:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav-dd-trigger.active{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
.nav-dd-trigger-icon{font-size:15px;line-height:1}
.nav-dd-trigger-label{font-size:13px}
.nav-dd-arrow{
  font-size:9px;opacity:.65;transition:transform .2s cubic-bezier(.4,0,.2,1);
  display:inline-block;margin-left:1px;
}
.nav-dd-trigger.active .nav-dd-arrow{transform:rotate(180deg);opacity:1}

/* dropdown panel */
.nav-dd-menu{
  position:absolute;top:calc(100% + 10px);left:0;
  background:#fff;
  border:1px solid rgba(0,0,0,.08);
  border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.08);
  min-width:240px;z-index:600;overflow:hidden;
  opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;
  transition:opacity .18s cubic-bezier(.4,0,.2,1), transform .18s cubic-bezier(.4,0,.2,1);
}
.nav-dd-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}

/* dropdown header label */
.nav-dd-header{
  padding:10px 16px 6px;
  font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:#aaa;
}

/* item */
.nav-dd-item{
  display:flex;align-items:center;gap:12px;
  width:100%;padding:10px 14px;
  background:none;border:none;
  font-size:13.5px;color:#2d2d3a;
  cursor:pointer;text-align:left;
  transition:background .12s;
  font-family:'Source Sans 3',sans-serif;
  line-height:1.3;
}
.nav-dd-item:hover{background:#f5f4ff}
.nav-dd-item:active{background:#ede9ff}

/* icon box */
.dd-icon-box{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
}
.dd-icon-box.purple{background:#ede9ff}
.dd-icon-box.orange{background:#fff3e0}
.dd-icon-box.green{background:#e8f5e9}
.dd-icon-box.blue{background:#e3f2fd}
.dd-icon-box.red{background:#ffebee}
.dd-icon-box.gray{background:#f5f5f5}
.dd-icon-box.teal{background:#e0f2f1}

.dd-text{flex:1}
.dd-label{display:block;font-weight:600;font-size:13.5px;color:#1a1a2e}
.dd-sub{display:block;font-size:11px;color:#888;margin-top:1px}

/* separator */
.nav-dd-sep{height:1px;background:#f0f0f5;margin:4px 0}

/* utility */
.nav-user-btn{
  display:flex;align-items:center;gap:6px;padding:7px 13px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  border-radius:8px;color:rgba(255,255,255,.85);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:all .18s;font-family:'Source Sans 3',sans-serif;
}
.nav-user-btn:hover{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}
.nav-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}

/* LANDING PAGE */
.landing-wrap{max-width:900px;margin:0 auto;padding:40px 20px 60px}
.landing-hero{text-align:center;margin-bottom:44px}
.landing-hero h1{font-family:'Playfair Display',serif;font-size:32px;color:var(--purple-dark);margin-bottom:8px}
.landing-hero p{font-size:15px;color:var(--text-muted);max-width:520px;margin:0 auto}
.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:32px}
@media(max-width:700px){.landing-grid{grid-template-columns:1fr}}
.landing-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:32px 28px;cursor:default;transition:box-shadow .2s,border-color .2s,transform .15s;position:relative;overflow:hidden}
.landing-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;border-radius:16px 16px 0 0}
.landing-card.cantieri::before{background:linear-gradient(90deg,var(--purple),var(--purple-light))}
.landing-card.risorse::before{background:linear-gradient(90deg,var(--orange),#f0a040)}
.landing-card.admin::before{background:linear-gradient(90deg,#b45309,#d97706)}
.landing-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.1);transform:translateY(-2px)}
.lc-icon{font-size:42px;margin-bottom:16px;display:block}
.lc-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--purple-dark);margin-bottom:8px}
.lc-desc{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin-bottom:22px}
.lc-actions{display:flex;flex-direction:column;gap:9px}
.lc-btn{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .16s;text-align:left;font-family:'Source Sans 3',sans-serif;width:100%}
.lc-btn:hover{border-color:var(--purple);background:#f5f0ff;color:var(--purple)}
.lc-btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.lc-btn.primary:hover{background:var(--purple-light);border-color:var(--purple-light)}
.lc-btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.lc-btn.orange:hover{background:#d07010;border-color:#d07010}
.lc-btn-icon{font-size:16px;width:20px;text-align:center}
.landing-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:600px){.landing-stats{grid-template-columns:1fr 1fr}}
.stat-card{background:#fff;border:1px solid var(--border-light);border-radius:12px;padding:18px 20px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:30px;color:var(--purple);line-height:1}
.stat-label{font-size:12px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* ADMIN PANEL */
.user-row{display:grid;grid-template-columns:1fr 1fr 80px auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.user-row:last-child{border-bottom:none}
.pwd-cell{font-family:monospace;font-size:12px;color:var(--text-muted);cursor:pointer;user-select:none}
.pwd-cell:hover{color:var(--purple)}
</style>

const AUTH_KEY = 'sl_users_v1';
const SESSION_KEY = 'sl_session';

function loadUsers(){
  try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }
  catch(e){ return null; }
}
function saveUsers(users){ localStorage.setItem(AUTH_KEY, JSON.stringify(users)); }

function initUsers(){
  let users = loadUsers();
  if(!users){
    // Prima volta: crea utente admin di default
    users = [{ username:'admin', password:'admin', role:'admin', createdAt: new Date().toISOString() }];
    saveUsers(users);
  }
  return users;
}

function getSession(){
  try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }
  catch(e){ return null; }
}
function setSession(user){ sessionStorage.setItem(SESSION_KEY, JSON.stringify(user)); }
function clearSession(){ sessionStorage.removeItem(SESSION_KEY); }

function doLogin(){
  const username = (document.getElementById('auth-user')?.value||'').trim();
  const password = (document.getElementById('auth-pass')?.value||'');
  const errEl = document.getElementById('auth-error');
  if(!username||!password){ errEl.textContent='Inserisci username e password.'; errEl.style.display=''; return; }
  const users = initUsers();
  const found = users.find(u => u.username===username && u.password===password);
  if(!found){ errEl.textContent='Credenziali non valide.'; errEl.style.display=''; document.getElementById('auth-pass').value=''; return; }
  setSession(found);
  document.getElementById('auth-overlay').style.display='none';
  document.querySelector('.topbar').style.display='';
  // Mostra dropdown admin se è admin
  if(found.role==='admin'){
    const ddAdmin = document.getElementById('dd-admin');
    if(ddAdmin) ddAdmin.style.display='';
  }
  render();
}

function doLogout(){
  clearSession();
  location.reload();
}

function showAdminPanel(){
  const users = initUsers();
  const rows = users.map((u,i)=>`
    <div class="user-row">
      <span style="font-weight:600">${escHtml(u.username)}</span>
      <span class="pwd-cell" title="Clicca per mostrare/nascondere" onclick="this.dataset.shown=this.dataset.shown==='1'?'0':'1';this.textContent=this.dataset.shown==='1'?'${escHtml(u.password)}':'••••••••'" data-shown="0">••••••••</span>
      <span style="font-size:11px;color:var(--${u.role==='admin'?'orange':'purple'});font-weight:700;text-transform:uppercase">${escHtml(u.role)}</span>
      ${u.username==='admin'?'<span></span>':`<button class="btn btn-danger btn-sm" onclick="deleteUser('${escHtml(u.username)}')">🗑</button>`}
    </div>
  `).join('');

  showModal('⚙️ Gestione Utenti',`

      <div style="display:grid;grid-template-columns:1fr 1fr 80px auto;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--border);font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px">

        <div class="card-title" style="margin-bottom:14px;font-size:15px">➕ Nuovo Utente</div>
        <div class="form-grid">
          <div class="form-group"><label>Username *</label><input id="nu_user" placeholder="es. mario.rossi"></div>
          <div class="form-group"><label>Password *</label><input id="nu_pass" type="text" placeholder="Password"></div>
          <div class="form-group">
            <label>Ruolo</label>
            <select id="nu_role"><option value="user">User</option><option value="admin">Admin</option></select>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" style="margin-top:8px" onclick="doAddUser()">✓ Crea Utente</button>
      </div>
    </div>
  `,[{label:'Chiudi',class:'btn-ghost',action:'closeModalDirect()'}]);
}

function doAddUser(){
  const username = (document.getElementById('nu_user')?.value||'').trim().toLowerCase();
  const password = (document.getElementById('nu_pass')?.value||'').trim();
  const role = document.getElementById('nu_role')?.value||'user';
  if(!username||!password){ showToast('Username e password obbligatori','error'); return; }
  const users = initUsers();
  if(users.find(u=>u.username===username)){ showToast('Username già esistente','error'); return; }
  users.push({ username, password, role, createdAt: new Date().toISOString() });
  saveUsers(users);
  showToast('Utente creato ✓','success');
  closeModalDirect();
  showAdminPanel();
}

function deleteUser(username){
  if(!confirm(`Eliminare l'utente "${username}"?`)) return;
  const users = initUsers().filter(u=>u.username!==username);
  saveUsers(users);
  showToast('Utente eliminato','info');
  closeModalDirect();
  showAdminPanel();
}

function toggleDropdown(name){
  const menu = document.getElementById('dd-menu-'+name);
  const trigger = menu?.previousElementSibling;
  const isOpen = menu?.classList.contains('open');
  closeDropdowns();
  if(!isOpen && menu){
    menu.classList.add('open');
    trigger?.classList.add('active');
  }
}
function closeDropdowns(){
  document.querySelectorAll('.nav-dd-menu').forEach(m=>m.classList.remove('open'));

});

function saveCantiereDati(){
  const c=currentCantiere;
  const g=(id)=>{const el=document.getElementById(id);return el?el.value.trim():'';};
  c.nome=g('f_nome')||c.nome;
  c.lavori=g('f_lavori');
  c.luogo=g('f_luogo');
  c.citta=g('f_citta');
  c.dataInizio=g('f_dataInizio');
  c.durataLavori=g('f_durata');
  c.numLavoratori=g('f_numLav');
  c.numImprese=g('f_numImp');
  c.ammontare=g('f_ammontare');
  c.ammontareLettere=g('f_ammLettere');
  c.stato=g('f_stato');
  c.committente={ragioneSociale:g('ct_rs'),referente:g('ct_ref'),via:g('ct_via'),cap:g('ct_cap'),citta:g('ct_citta'),cf:g('ct_cf'),piva:g('ct_piva'),sedeLegale:g('ct_sedeLegale')};
  c.rl={nome:g('rl_nome'),cf:g('rl_cf'),luogoNascita:g('rl_luogoN'),dataNascita:g('rl_dataN'),studio:g('rl_studio'),via:g('rl_via'),cap:g('rl_cap'),citta:g('rl_citta')};
  c.csp={nome:g('csp_nome'),cf:g('csp_cf'),luogoNascita:g('csp_luogoN'),dataNascita:g('csp_dataN'),studio:g('csp_studio'),via:g('csp_via'),cap:g('csp_cap'),citta:g('csp_citta')};
  c.cse={nome:g('cse_nome'),cf:g('cse_cf'),luogoNascita:g('cse_luogoN'),dataNascita:g('cse_dataN'),studio:g('cse_studio'),via:g('cse_via'),cap:g('cse_cap'),citta:g('cse_citta')};
  c.acse={nome:g('acse_nome'),cf:g('acse_cf'),luogoNascita:g('acse_luogoN'),dataNascita:g('acse_dataN'),studio:g('acse_studio'),via:g('acse_via'),cap:g('acse_cap'),citta:g('acse_citta')};
  c.impresaAff={ragioneSociale:g('ia_rs'),piva:g('ia_piva'),via:g('ia_via'),cap:g('ia_cap'),citta:g('ia_citta')};
  saveCantiere(c);
  currentCantiere=c;
  showToast('Dati cantiere salvati ✓','success');
}

function renderModule(){
  const c=currentCantiere;
  const mId=currentModule;
  const def=MOD_DEFS[mId];
  if(!c||!def) return renderHome();
  const recs=c.records[mId]||[];

  return `
    <div class="breadcrumb">
      <a onclick="navigate('landing')">🏠 Home</a>
      <span class="breadcrumb-sep">›</span>
      <a onclick="navigate('home')">Cantieri</a>
      <span class="breadcrumb-sep">›</span>

function renderSingleModule(c,mId,def,recs){

        <div class="card-header">

          <button class="btn btn-outline" onclick="saveModuleRecord('${mId}',0)">💾 Salva</button>
          <button class="btn btn-orange" onclick="generateDoc('${mId}',0)">📄 Genera PDF</button>
        </div>
      </div>

}

function renderMultiModule(c,mId,def,recs){
  return `
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-header">
          <span class="card-title">Documenti (${recs.length})</span>
          <button class="btn btn-primary btn-sm" onclick="addModuleRecord('${mId}')">＋ Nuovo Documento</button>
        </div>
        ${recs.length===0?`
          <div class="empty-state" style="padding:32px">
            <div class="empty-state-icon" style="font-size:36px">📄</div>
            <div class="empty-state-title" style="font-size:16px">Nessun documento</div>
            <p class="text-sm text-muted" style="margin-bottom:16px">Crea il primo documento per questo modulo</p>
            <button class="btn btn-primary btn-sm" onclick="addModuleRecord('${mId}')">＋ Aggiungi</button>
          </div>
        `:`
          <div style="display:flex;flex-direction:column;gap:10px">
            ${recs.map((r,i)=>`
              <div style="background:var(--bg);border-radius:6px;padding:14px 16px;display:flex;align-items:center;gap:12px">
                <div style="flex:1">
                  <div style="font-weight:600;font-size:14px">${getRecordTitle(mId,r,i)}</div>
                  <div class="text-sm text-muted">${getRecordMeta(mId,r)}</div>
                </div>
                <button class="btn btn-outline btn-sm" onclick="editModuleRecord('${mId}',${i})">✏️ Modifica</button>
                <button class="btn btn-orange btn-sm" onclick="generateDoc('${mId}',${i})">📄 PDF</button>
                <button class="btn btn-ghost btn-sm" onclick="deleteRecord('${mId}',${i})" title="Elimina">🗑</button>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

function getRecordTitle(mId,r,i){
  const n=i+1;
  switch(mId){
    case 'm07': case 'm08': case 'm09': case 'm10': case 'm12':
      return `${n}. ${r.nomeImpresa||'Impresa senza nome'}`;
    case 'm11': return `${n}. Registro al ${r.dataAggiornamento||'...'}`;
    case 'm14': return `${n}. Verbale ${r.progressivo||''} del ${r.data||'...'}`;
    case 'm15': return `${n}. Presenze ${r.progressivo||''} del ${r.data||'...'}`;
    case 'm16': return `${n}. Sopralluogo ${r.progressivo||''} – ${r.impresaEsecutrice||'...'}`;
    case 'm17': return `${n}. Segnalazione ${r.progressivo||''} del ${r.data||'...'}`;
    case 'm18': return `${n}. Sospensione ${r.progressivo||''} del ${r.data||'...'}`;
    case 'm19': return `${n}. NC ${r.numVerbale||''} – ${r.impresa||'...'}`;
    default: return `Documento ${n}`;
  }
}

function getRecordMeta(mId,r){
  switch(mId){
    case 'm07': case 'm08': case 'm09': case 'm10': return r.tipologia||'';
    case 'm11': return `${r.rows?.length||0} righe`;
    case 'm14': return `Riunione ${r.luogo||''}`;

function collectM07Docs(){
  var docs=[];var tbody=document.getElementById('m07_docs_tbody');if(!tbody)return docs;
  tbody.querySelectorAll('tr').forEach(function(row){docs.push({
    rich:row.querySelector('.m07_rich')?row.querySelector('.m07_rich').value:'X',
    prod:row.querySelector('.m07_prod')?row.querySelector('.m07_prod').value:'',
    note:row.querySelector('.m07_note')?row.querySelector('.m07_note').value:''
  });});return docs;
}

function saveModuleRecord(mId, idx){
  const c=currentCantiere;
  if(!c.records) c.records={};
  if(!c.records[mId]) c.records[mId]=[];
  const data=collectFormData(mId);
  c.records[mId][idx]=data;
  saveCantiere(c);
  currentCantiere=c;
  showToast('Salvato ✓','success');
}

function addModuleRecord(mId){
  const c=currentCantiere;
  if(!c.records) c.records={};
  if(!c.records[mId]) c.records[mId]=[];
  const def=MOD_DEFS[mId];
  showModal(def.title+' – Nuovo Documento', `
    <div>${getModuleForm(c,mId,{},c.records[mId].length)}</div>
  `, [
    {label:'Annulla',class:'btn-ghost',action:'closeModal()'},
    {label:'💾 Salva',class:'btn-outline',action:`saveNewRecord('${mId}')`},
    {label:'📄 Salva e Genera PDF',class:'btn-orange',action:`saveAndGenerate('${mId}')`},
  ]);
  attachDynamicEvents();
}

function saveNewRecord(mId){
  const c=currentCantiere;
  if(!c.records) c.records={};
  if(!c.records[mId]) c.records[mId]=[];
  const data=collectFormData(mId);
  c.records[mId].push(data);
  saveCantiere(c);
  currentCantiere=c;
  closeModalDirect();
  render();
  showToast('Documento aggiunto ✓','success');
}

function saveAndGenerate(mId){
  const c=currentCantiere;
  if(!c.records) c.records={};
  if(!c.records[mId]) c.records[mId]=[];
  const data=collectFormData(mId);
  c.records[mId].push(data);
  saveCantiere(c);
  currentCantiere=c;
  closeModalDirect();
  render();
  const idx=c.records[mId].length-1;
  setTimeout(()=>generateDoc(mId,idx),500);
}

function editModuleRecord(mId,idx){
  const c=currentCantiere;
  const rec=c.records[mId][idx];
  const def=MOD_DEFS[mId];
  showModal(def.title+' – Modifica', `
    <div>${getModuleForm(c,mId,rec,idx)}</div>
  `, [
    {label:'Annulla',class:'btn-ghost',action:'closeModal()'},
    {label:'💾 Salva',class:'btn-outline',action:`updateRecord('${mId}',${idx})`},
    {label:'📄 Salva e Genera PDF',class:'btn-orange',action:`updateAndGenerate('${mId}',${idx})`},
  ]);
  attachDynamicEvents();
}

function updateRecord(mId,idx){
  const c=currentCantiere;
  const data=collectFormData(mId);
  c.records[mId][idx]=data;
  saveCantiere(c);
  currentCantiere=c;
  closeModalDirect();
  render();
  showToast('Aggiornato ✓','success');
}

function updateAndGenerate(mId,idx){
  updateRecord(mId,idx);
  setTimeout(()=>generateDoc(mId,idx),300);
}

function deleteRecord(mId,idx){
  if(!confirm('Eliminare questo documento?')) return;
  const c=currentCantiere;
  c.records[mId].splice(idx,1);
  saveCantiere(c);
  currentCantiere=c;
  render();
  showToast('Eliminato','info');
}

function fmtDate(d){
  if(!d) return '___________';
  try{
    const dt=new Date(d);
    return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
  }catch(e){return d;}
}
function v(x){return x||'_______________________';}
function vi(x){return x||'';}


// ============================================================
// GENERATE PDF VIA WINDOW.PRINT — zero external dependencies
// ============================================================
function generateDoc(mId, idx){
  var c = currentCantiere;
  if(!c.records || !c.records[mId]){
    var def0 = MOD_DEFS[mId];
    if(!def0.multi){ saveModuleRecord(mId, idx); }
  }
  var rec = (c.records && c.records[mId] && c.records[mId][idx]) || {};
  var def  = MOD_DEFS[mId];
  try{
    var html = buildPdfHtml(mId, c, rec, def);
    var w = window.open('', '_blank');
    if(!w){ showToast('Abilita i popup per questo file nei permessi del browser','error'); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(function(){ w.print(); }, 600);
    showToast('Finestra aperta — nel dialogo di stampa scegli “Salva come PDF”','success');
  } catch(err){
    console.error(err);
    showToast('Errore: ' + err.message, 'error');
  }
}

function e(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function v(x){ return (x&&String(x).trim())?String(x).trim():'_______________________'; }
function vi(x){ return x?String(x).trim():''; }
function fd(d){ if(!d)return'___________'; try{return new Date(d).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});}catch(ex){return d;} }
function p(t,c){ return '<div class="p'+(c?' '+c:'')+'">'+(t?e(t):'&nbsp;')+'</div>'; }

function big(t){ return '<div class="big">'+e(t)+'</div>'; }

function td(cols){ return '<tr>'+cols.map(function(c){return'<td>'+e(String(c==null?'':c))+'</td>';}).join('')+'</tr>'; }
function er(n,cols){ return Array(n).fill('<tr>'+Array(cols).fill('<td>&nbsp;</td>').join('')+'</tr>').join(''); }

    el.style.cssText='position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999;transition:opacity .3s;box-shadow:0 4px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:8px';
    document.body.appendChild(el);
  }
  const colors={success:'background:#1a6b2a;color:#fff',error:'background:#b01010;color:#fff',info:'background:#1a4e8e;color:#fff'};
  el.style.cssText+=';'+colors[type];
  el.textContent=msg;
  el.style.opacity='1';
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{el.style.opacity='0';},3000);
}

// GIORNI LAVORATIVI – CALENDARIO ITALIANO
// ============================================================
function getEaster(year){
  // Algoritmo Gregoriano Anonimo
  const a=year%19,b=Math.floor(year/100),c=year%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4;
  const l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return [month,day];
}

const _holidayCache={};
function getItalianHolidays(year){
  if(_holidayCache[year]) return _holidayCache[year];
  const s=new Set();
  const a=(m,d)=>s.add(`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  a(1,1);a(1,6);a(4,25);a(5,1);a(6,2);
  a(8,15);a(11,1);a(12,8);a(12,25);a(12,26);
  const [em,ed]=getEaster(year);
  a(em,ed);
  const eD=new Date(year,em-1,ed+1);
  a(eD.getMonth()+1,eD.getDate()); // Lunedì dell'Angelo
  _holidayCache[year]=s;
  return s;
}

function isWorkingDay(date){
  const d=new Date(date); d.setHours(0,0,0,0);
  const dow=d.getDay();
  if(dow===0||dow===6) return false;
  return !getItalianHolidays(d.getFullYear()).has(d.toISOString().slice(0,10));
}

function countWorkingDays(start,end){
  const s=new Date(start); s.setHours(0,0,0,0);
  const e=new Date(end);   e.setHours(0,0,0,0);
  let count=0;
  const cur=new Date(s);
  while(cur<=e){ if(isWorkingDay(cur)) count++; cur.setDate(cur.getDate()+1); }
  return count;
}

// Giorni lavorativi tra due date clampati a [oggi, futuro]
function workingDaysInRange(dalStr,alStr,oggi,futuro){
  const dal=dalStr?new Date(dalStr):oggi;
  const al =alStr ?new Date(alStr) :futuro;
  const s=dal<oggi?oggi:dal;
  const e=al>futuro?futuro:al;
  if(e<s) return 0;
  return countWorkingDays(s,e);
}

function renderGantt(){
  if(RISORSE.persone.length===0) return '<p class="text-muted text-sm" style="padding:12px">Nessun dato disponibile.</p>';
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const startDate=new Date(oggi); startDate.setDate(1);
  const endDate=new Date(startDate); endDate.setMonth(endDate.getMonth()+6);
  const totalDays=Math.ceil((endDate-startDate)/(1000*60*60*24));
  const rowH=34;const headerH=36;const labelW=140;const barArea=640;
  const h=headerH+RISORSE.persone.length*rowH+10;
  const pxPerDay=barArea/totalDays;

  // month headers
  const months=[];
  let cur=new Date(startDate);
  while(cur<endDate){
    const mStart=new Date(cur);
    const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    const effEnd=mEnd>endDate?endDate:mEnd;
    const dayOffset=Math.ceil((mStart-startDate)/(1000*60*60*24));
    const dayLen=Math.ceil((effEnd-mStart)/(1000*60*60*24));
    months.push({label:cur.toLocaleDateString('it-IT',{month:'short',year:'2-digit'}),x:labelW+dayOffset*pxPerDay,w:dayLen*pxPerDay});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }

  // today line
  const todayX=labelW+Math.ceil((oggi-startDate)/(1000*60*60*24))*pxPerDay;

  const colors=['#5e2670','#e07020','#1a6b2a','#1a4e8e','#b01010','#c07010','#2d7d9a'];

  let svg=`<svg class="gantt-svg" viewBox="0 0 ${labelW+barArea+20} ${h}" style="min-width:600px;width:100%;font-family:'Source Sans 3',sans-serif">`;
  // bg
  svg+=`<rect x="0" y="0" width="${labelW+barArea+20}" height="${h}" fill="#fafafa" rx="4"/>`;
  // month header bg
  months.forEach((m,i)=>{
    svg+=`<rect x="${m.x}" y="0" width="${m.w}" height="${headerH}" fill="${i%2===0?'#3d1a4a':'#5e2670'}"/>`;
    svg+=`<text x="${m.x+m.w/2}" y="${headerH/2+5}" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">${m.label}</text>`;
  });
  // row lines
  RISORSE.persone.forEach((_,i)=>{
    const y=headerH+i*rowH;
    svg+=`<rect x="${labelW}" y="${y}" width="${barArea}" height="${rowH}" fill="${i%2===0?'#fff':'#f8f5fc'}"/>`;
    svg+=`<line x1="${labelW}" y1="${y+rowH}" x2="${labelW+barArea}" y2="${y+rowH}" stroke="#e8e3dc" stroke-width="1"/>`;
  });
  // today line
  if(todayX>=labelW&&todayX<=labelW+barArea){
    svg+=`<line x1="${todayX}" y1="${headerH}" x2="${todayX}" y2="${h}" stroke="#e07020" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    svg+=`<text x="${todayX+3}" y="${headerH+12}" fill="#e07020" font-size="9" font-weight="700">Oggi</text>`;
  }
  // person labels + bars
  RISORSE.persone.forEach((p,i)=>{
    const y=headerH+i*rowH;
    const nome=(p.nome+' '+(p.cognome||'')).trim();
    const initials=((p.nome[0]||'')+(p.cognome?p.cognome[0]:'')).toUpperCase();
    svg+=`<text x="${labelW-8}" y="${y+rowH/2+4}" text-anchor="end" fill="#2a2a2a" font-size="12">${nome.length>17?nome.slice(0,17)+'…':nome}</text>`;
    // bars for this person
    const pallocs=RISORSE.allocazioni.filter(a=>a.personaId===p.id&&a.cantiereId&&STATE[a.cantiereId]);
    pallocs.forEach((a,ai)=>{
      const dal=a.dal?new Date(a.dal):startDate;
      const al=a.al?new Date(a.al):endDate;
      const barStart=Math.max(0,Math.ceil((dal-startDate)/(1000*60*60*24)));
      const barEnd=Math.min(totalDays,Math.ceil((al-startDate)/(1000*60*60*24))+1);
      if(barEnd<=0||barStart>=totalDays) return;
      const bx=labelW+barStart*pxPerDay;
      const bw=Math.max(4,(barEnd-barStart)*pxPerDay);
      const col=colors[ai%colors.length];
      const c=STATE[a.cantiereId];
      svg+=`<rect x="${bx}" y="${y+5}" width="${bw}" height="${rowH-12}" fill="${col}" rx="3" opacity="0.85"/>`;
      if(bw>50){
        const label=(c?c.nome.slice(0,12):'?')+(a.ruolo?' · '+a.ruolo.slice(0,8):'');
        svg+=`<text x="${bx+5}" y="${y+rowH/2+4}" fill="#fff" font-size="10" font-weight="600">${label}</text>`;
      }
    });
  });
  svg+=`</svg>`;
  return svg;
}

function renderWorkloadChart(){
  if(RISORSE.persone.length===0) return '<p class="text-muted text-sm" style="padding:8px 0">Nessun dato.</p>';
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const futuro=new Date(oggi); futuro.setMonth(futuro.getMonth()+6);
  const totaleGgLav=countWorkingDays(oggi,futuro); // ~130 gg lavorativi in 6 mesi
  const data=RISORSE.persone.map(p=>{
    const allocs=RISORSE.allocazioni.filter(a=>a.personaId===p.id);
    let ggLav=0;
    allocs.forEach(a=>{ ggLav+=workingDaysInRange(a.dal,a.al,oggi,futuro); });
    const pct=Math.min(100,Math.round(ggLav/totaleGgLav*100));
    return {nome:(p.nome+' '+(p.cognome||'')).trim(),ggLav,pct};
  }).filter(d=>d.ggLav>0).sort((a,b)=>b.ggLav-a.ggLav);
  if(data.length===0) return '<p class="text-muted text-sm" style="padding:8px 0">Nessuna allocazione nei prossimi 6 mesi.</p>';
  const max=data[0].ggLav||1;
  const alertColor=p=>p>=90?'#b01010':p>=70?'#c07010':'var(--purple)';
  return `
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">
      Giorni lavorativi disponibili (escl. weekend e festività italiane) nei prossimi 6 mesi: <strong>${totaleGgLav} gg</strong>
    </div>
    <div class="chart-bars">${data.map(d=>`
      <div class="chart-bar-row">
        <span class="chart-bar-label">${escHtml(d.nome)}</span>
        <div class="chart-bar-track">
          <div class="chart-bar-fill" style="width:${Math.round(d.ggLav/max*100)}%;background:linear-gradient(90deg,${alertColor(d.pct)},${d.pct>=90?'#e07020':d.pct>=70?'#e07020':'var(--orange)'})"></div>
          <span class="chart-bar-val">${d.ggLav}gg</span>
        </div>
        <span style="font-size:11px;color:${alertColor(d.pct)};width:36px;text-align:right;flex-shrink:0;font-weight:700">${d.pct}%</span>
      </div>`).join('')}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-top:8px">
      % = saturazione rispetto ai ${totaleGgLav} gg lavorativi disponibili. 
      <span style="color:#b01010;font-weight:600">≥90% sovraccarico</span> · 
      <span style="color:#c07010;font-weight:600">≥70% elevato</span>
    </div>`;
}

// ---- CONTEXT BUILDER ----
function buildRisorseContext(){
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const oggiStr=oggi.toISOString().slice(0,10);
  const futuro=new Date(oggi); futuro.setMonth(futuro.getMonth()+6);
  const totGgLav=countWorkingDays(oggi,futuro);

  const cantieri=Object.values(STATE).map(c=>({
    id:c.id, nome:c.nome, luogo:c.luogo||'', stato:c.stato,
    dataInizio:c.dataInizio||'', durataLavori:c.durataLavori||''
  }));

  const persone=RISORSE.persone.map(p=>{
    const myAllocs=RISORSE.allocazioni.filter(a=>a.personaId===p.id);
    const ggOccupati=myAllocs.reduce((s,a)=>s+workingDaysInRange(a.dal,a.al,oggi,futuro),0);
    const ggDisp=Math.max(0,totGgLav-ggOccupati);
    const pct=Math.round(ggOccupati/totGgLav*100);
    return {
      id:p.id,
      nome:p.nome+' '+(p.cognome||''),
      qualifica:p.qualifica||'',
      giorniLavorativiOccupati_6mesi:ggOccupati,
      giorniLavorativiDisponibili_6mesi:ggDisp,
      saturazione_pct:pct
    };
  });

  const allocazioni=RISORSE.allocazioni.map(a=>{
    const p=RISORSE.persone.find(x=>x.id===a.personaId);
    const c=STATE[a.cantiereId];
    const ggLav=countWorkingDays(
      a.dal?new Date(a.dal):oggi,
      a.al?new Date(a.al):futuro
    );
    return {
      personaId:a.personaId,
      persona:p?p.nome+' '+(p.cognome||''):'N/D',
      cantiere:c?c.nome:'N/D',
      cantiereId:a.cantiereId,
      ruolo:a.ruolo||'',
      dal:a.dal||'',
      al:a.al||'indefinito',
      giorniLavorativi:ggLav
    };
  });

  return `Sei un assistente esperto in pianificazione risorse per cantieri edili nel settore della sicurezza sul lavoro (D.Lgs. 81/08).
Data odierna: ${oggiStr}. Giorni lavorativi disponibili nei prossimi 6 mesi (esclusi weekend e festività italiane): ${totGgLav}.

CANTIERI:
${JSON.stringify(cantieri,null,1)}

PERSONALE (con saturazione calcolata su giorni lavorativi reali, escludendo weekend e festività):
${JSON.stringify(persone,null,1)}

ALLOCAZIONI ESISTENTI:
${JSON.stringify(allocazioni,null,1)}

ISTRUZIONI:
- Rispondi sempre in italiano, in modo conciso e preciso.
- Usa elenchi puntati quando appropriato.
- I giorni indicati sono GIORNI LAVORATIVI (esclusi sabato, domenica e festività nazionali italiane).
- Se una persona non ha allocazioni attive dopo oggi, è "disponibile".
- Saturazione ≥90% = sovraccarico, ≥70% = carico elevato.
- Quando suggerisci un'allocazione, OBBLIGATORIAMENTE aggiungi in fondo alla risposta un blocco JSON esattamente in questo formato (usa gli id reali dal contesto):
%%ALLOCAZIONE%%
{"personaId":"ID_REALE","cantiereId":"ID_REALE","ruolo":"RUOLO","dal":"YYYY-MM-DD","al":"YYYY-MM-DD","motivo":"breve motivazione"}
%%END%%
- Se non c'è nessun candidato adatto, dillo chiaramente senza produrre il blocco JSON.`;
}

async function doSuggerisciAllocazione(){
  const cantiereId=document.getElementById('sugg_cantiere')?.value;
  const ruolo=(document.getElementById('sugg_ruolo')?.value||'').trim();
  const dal=(document.getElementById('sugg_dal')?.value||'').trim();
  const al=(document.getElementById('sugg_al')?.value||'').trim();
  if(!cantiereId){ showToast('Seleziona un cantiere','error'); return; }
  if(!ruolo){ showToast('Specifica il ruolo cercato','error'); return; }
  const c=STATE[cantiereId];
  const ggRich=dal&&al?countWorkingDays(new Date(dal),new Date(al)):null;
  const prompt=`Suggerisci la persona più adatta da allocare sul cantiere "${c?c.nome:cantiereId}" nel ruolo di "${ruolo}"${dal?` dal ${dal}`:''}${al?` al ${al}`:''}${ggRich?` (${ggRich} giorni lavorativi)`:''}.
Analizza la disponibilità e la saturazione di tutto il personale registrato, considera le qualifiche, e scegli il candidato migliore motivando brevemente la scelta. Poi fornisci il blocco %%ALLOCAZIONE%% richiesto.`;
  await dispatchChat(prompt, true);
}

async function dispatchChat(text, isSystem=false){
  const msgs=document.getElementById('chat-messages');
  if(!msgs) return;
  const sendBtn=document.getElementById('chat-send-btn');
  if(sendBtn) sendBtn.disabled=true;

  if(!isSystem) msgs.innerHTML+=`<div class="chat-msg user">${escHtml(text)}</div>`;
  const thinkId='think_'+Date.now();
  msgs.innerHTML+=`<div class="chat-msg bot thinking" id="${thinkId}">⏳ Sto analizzando i dati…</div>`;
  msgs.scrollTop=msgs.scrollHeight;

  chatHistory.push({role:'user',content:text});

  try{
    const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+RISORSE.groqApiKey},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        messages:[{role:'system',content:buildRisorseContext()},...chatHistory],
        max_tokens:1000, temperature:0.3
      })
    });
    const data=await res.json();
    const think=document.getElementById(thinkId);
    if(think) think.remove();

    if(data.error){
      msgs.innerHTML+=`<div class="chat-msg bot" style="border-left:3px solid var(--danger)">❌ ${escHtml(data.error.message||'Errore')}</div>`;
    } else {
      const reply=data.choices?.[0]?.message?.content||'Nessuna risposta.';
      chatHistory.push({role:'assistant',content:reply});

      // Estrai eventuale blocco allocazione
      const allocMatch=reply.match(/%%ALLOCAZIONE%%\s*([\s\S]*?)\s*%%END%%/);
      const cleanReply=reply.replace(/%%ALLOCAZIONE%%[\s\S]*?%%END%%/,'').trim();

      const formatted=escHtml(cleanReply)
        .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
        .replace(/\n/g,'<br>');
      msgs.innerHTML+=`<div class="chat-msg bot">${formatted}</div>`;

      // Se c'è un suggerimento allocazione, mostra la card
      if(allocMatch){
        try{
          const sug=JSON.parse(allocMatch[1].trim());
          const pName=(RISORSE.persone.find(x=>x.id===sug.personaId)||{nome:'N/D',cognome:''});
          const cName=STATE[sug.cantiereId];
          const ggProp=sug.dal&&sug.al?countWorkingDays(new Date(sug.dal),new Date(sug.al)):null;
          const cardId='ac_'+Date.now();
          // Salviamo il suggerimento globalmente per il click
          window['_sugg_'+cardId]=sug;
          msgs.innerHTML+=`
            <div class="alloc-sugg-card" id="${cardId}">
              <div class="alloc-sugg-card-title">🎯 Allocazione suggerita</div>
              <div class="alloc-sugg-card-row"><span class="alloc-sugg-card-key">Persona</span><span class="alloc-sugg-card-val">${escHtml(pName.nome+' '+(pName.cognome||''))}</span></div>
              <div class="alloc-sugg-card-row"><span class="alloc-sugg-card-key">Cantiere</span><span class="alloc-sugg-card-val">${escHtml(cName?cName.nome:'–')}</span></div>
              <div class="alloc-sugg-card-row"><span class="alloc-sugg-card-key">Ruolo</span><span class="alloc-sugg-card-val">${escHtml(sug.ruolo||'–')}</span></div>
              <div class="alloc-sugg-card-row"><span class="alloc-sugg-card-key">Dal → Al</span><span class="alloc-sugg-card-val">${sug.dal||'–'} → ${sug.al||'–'}${ggProp?` (${ggProp}gg lav.)`:''}</span></div>
              ${sug.motivo?`<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic">${escHtml(sug.motivo)}</div>`:''}
              <button class="alloc-sugg-card-btn" onclick="applyAllocSuggestion('_sugg_${cardId}','${cardId}')">
                ✓ Crea questa allocazione
              </button>
            </div>`;
        }catch(e){ /* JSON non valido, ignora */ }
      }
    }
  }catch(err){
    const think=document.getElementById(thinkId);
    if(think) think.remove();
    msgs.innerHTML+=`<div class="chat-msg bot" style="border-left:3px solid var(--danger)">❌ Errore di rete: ${escHtml(err.message)}</div>`;
  }
  msgs.scrollTop=msgs.scrollHeight;
  if(sendBtn) sendBtn.disabled=false;
}

function applyAllocSuggestion(globalKey, cardId){
  const sug=window[globalKey];
  if(!sug){ showToast('Dati non più disponibili','error'); return; }
  if(!sug.personaId||!sug.cantiereId||!sug.dal){
    showToast('Dati suggerimento incompleti','error'); return;
  }
  const a={id:genRId(),personaId:sug.personaId,cantiereId:sug.cantiereId,
    ruolo:sug.ruolo||'',dal:sug.dal||'',al:sug.al||'',note:'Creata da suggerimento AI'};
  RISORSE.allocazioni.push(a);

// ---- SINCRONIZZAZIONE AUTOMATICA ALLOCAZIONE → CANTIERE ----
// Mappa ruolo → chiave campo nel cantiere
function ruoloToCampoFigura(ruolo){
  if(!ruolo) return null;
  const r=ruolo.trim().toUpperCase();
  // ACSE prima di CSE per evitare match errato
  if(/\bACSE\b|ASS.{0,10}CSE|ASS.{0,12}COORD/i.test(r))    return 'acse';
  if(/\bCSE\b|COORD.{0,20}ESECUZ/i.test(r))                  return 'cse';
  if(/\bCSP\b|COORD.{0,20}PROGETT/i.test(r))                 return 'csp';
  if(/\bRL\b|RESP.{0,8}LAVORI|RESPONSABILE.{0,8}LAVORI/i.test(r)) return 'rl';
  return null;
}

function syncAllocazioneToCantiere(alloc){
  const campo=ruoloToCampoFigura(alloc.ruolo);
  if(!campo) return false;
  const p=RISORSE.persone.find(x=>x.id===alloc.personaId);
  const c=STATE[alloc.cantiereId];
  if(!p||!c) return false;
  const nomeCompleto=(p.nome+' '+(p.cognome||'')).trim();
  if(!c[campo]) c[campo]={nome:'',cf:'',luogoNascita:'',dataNascita:'',studio:'',via:'',cap:'',citta:''};
  c[campo].nome        = nomeCompleto;
  c[campo].cf          = p.cf||c[campo].cf||'';
  c[campo].luogoNascita= p.luogoNascita||c[campo].luogoNascita||'';
  c[campo].dataNascita = p.dataNascita||c[campo].dataNascita||'';
  c[campo].studio      = p.studio||c[campo].studio||'';
  c[campo].via         = p.via||c[campo].via||'';
  c[campo].cap         = p.cap||c[campo].cap||'';
  c[campo].citta       = p.citta||c[campo].citta||'';
  saveCantiere(c);
  return campo;
}

function reSyncPersonaSuTuttiCantieri(personaId){
  // Ricalcola tutti i cantieri che hanno allocazioni con questa persona
  RISORSE.allocazioni
    .filter(a=>a.personaId===personaId)
    .forEach(a=>syncAllocazioneToCantiere(a));
}

let FB_APP = null;
let FB_DB  = null;
let dbTab  = 'connessione';
let _autoSyncTimer = null;
let _syncStatus = 'idle'; // idle | pending | syncing | ok | err
let _applyingRemote = false;       // true mentre si applica un aggiornamento ricevuto dal DB
let _realtimeListenersActive = false; // true quando i listener real-time sono attivi

function scheduleAutoSync(){
  if(!FB_DB) return;
  if(_applyingRemote) return; // non fare upload se stiamo applicando dati dal DB
  _syncStatus='pending';
  updateSyncBadge();
  clearTimeout(_autoSyncTimer);
  _autoSyncTimer = setTimeout(()=>{ doAutoSync(); }, 2500);
}

async function doAutoSync(){
  if(!FB_DB) return;
  _syncStatus='syncing';
  updateSyncBadge();
  try{
    await FB_DB.ref('cantieri').set(STATE);
    await FB_DB.ref('risorse').set({
      persone: RISORSE.persone.length ? RISORSE.persone : [],
      allocazioni: RISORSE.allocazioni.length ? RISORSE.allocazioni : [],
      groqApiKey: RISORSE.groqApiKey||'',
      _updated: new Date().toISOString()
    });
    const meta={...loadSyncMeta(), lastUpload: new Date().toISOString(),
      cantieriCount: Object.keys(STATE).length, personeCount: RISORSE.persone.length};
    saveSyncMeta(meta);
    _syncStatus='ok';
    addLog('☁ Auto-sync completato: '+new Date().toLocaleTimeString('it-IT'),'info');
  }catch(err){
    _syncStatus='err';
    addLog('❌ Auto-sync fallito: '+err.message,'err');
  }
  updateSyncBadge();
}

function updateSyncBadge(){
  const el=document.getElementById('sync-badge');
  if(!el) return;
  const map={
    idle:  {icon:'☁',  text:'',                  color:'rgba(255,255,255,0.4)'},
    pending:{icon:'⏳', text:'In attesa…',         color:'#ffe082'},
    syncing:{icon:'🔄', text:'Sincronizzazione…',  color:'#80c0ff'},
    ok:    {icon:'☁✓', text:_realtimeListenersActive?'In ascolto':'Sincronizzato', color:'#a5d6a7'},
    err:   {icon:'☁✗', text:'Errore sync',         color:'#ff8080'},
  };
  const s=map[_syncStatus]||map.idle;
  el.innerHTML=`<span style="color:${s.color};font-size:12px;display:flex;align-items:center;gap:5px">${s.icon}${s.text?` <span>${s.text}</span>`:''}</span>`;
}

}

function loadSyncMeta(){

let SYNC_LOG=[];
function addLog(msg,type='ok'){
  const ts=new Date().toLocaleTimeString('it-IT');
  SYNC_LOG.unshift({msg,type,ts});
  if(SYNC_LOG.length>30) SYNC_LOG.pop();
  const el=document.getElementById('sync-log');
  if(el) el.innerHTML=SYNC_LOG.map(l=>`<span class="log-${l.type==='ok'?'':'log-'}">[${l.ts}] <span class="${l.type==='err'?'log-err':l.type==='warn'?'log-warn':'log-info'}">${escHtml(l.msg)}</span></span>`).join('<br>');
}

// Carica SDK Firebase dinamicamente
function loadFirebaseSDK(){
  return new Promise((resolve,reject)=>{
    if(window.firebase && window.firebase.database){ resolve(); return; }
    const scripts=[
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'
    ];
    let loaded=0;
    scripts.forEach(src=>{
      // evita di ricaricare script già presenti
      if(document.querySelector(`script[src="${src}"]`)){ loaded++; if(loaded===scripts.length) resolve(); return; }
      const s=document.createElement('script');
      s.src=src; s.async=false;
      s.onload=()=>{ loaded++; if(loaded===scripts.length) resolve(); };
      s.onerror=()=>reject(new Error('Impossibile caricare Firebase SDK. Controlla la connessione internet.'));
      document.head.appendChild(s);
    });
  });
}

async function connectFirebase(cfg){
  try{
    addLog('Caricamento SDK Firebase Realtime Database…','info');
    await loadFirebaseSDK();
    addLog('SDK caricato. Inizializzazione app…','info');
    // Elimina app esistente se presente
    detachRealtimeListeners();
    if(FB_APP){
      try{ await FB_APP.delete(); }catch(e){}
      FB_APP=null; FB_DB=null;
    }
    if(!cfg.databaseURL){
      throw new Error('databaseURL mancante. Inserisci l\'URL del Realtime Database (es. https://mio-progetto-default-rtdb.europe-west1.firebasedatabase.app)');
    }
    FB_APP = firebase.initializeApp(cfg, 'sl_app_'+Date.now());
    FB_DB  = firebase.database(FB_APP);
    // Test connessione: scrittura nodo di test
    await FB_DB.ref('_test/ping').set({t: new Date().toISOString()});
    await FB_DB.ref('_test/ping').remove();
    saveFbConfig(cfg);
    addLog('✅ Connesso a Firebase Realtime Database con successo!','info');
    _syncStatus='ok';
    showToast('Firebase connesso ✓','success');
    updateSyncBadge();
    attachRealtimeListeners();
    render();
  }catch(err){
    addLog('❌ Errore connessione: '+err.message,'err');
    showToast('Errore Firebase: '+err.message,'error');
    FB_APP=null; FB_DB=null;
  }
}

async function syncToFirebase(){
  if(!FB_DB){ showToast('Collega prima Firebase','error'); return; }
  try{
    addLog('⬆ Inizio upload verso Firebase Realtime Database…','info');
    // Salva cantieri (tutto lo STATE come unico nodo JSON)
    await FB_DB.ref('cantieri').set(STATE);
    addLog(`✅ ${Object.keys(STATE).length} cantieri caricati.`,'info');
    // Salva risorse
    await FB_DB.ref('risorse').set({
      persone: RISORSE.persone.length ? RISORSE.persone : [],
      allocazioni: RISORSE.allocazioni.length ? RISORSE.allocazioni : [],
      groqApiKey: RISORSE.groqApiKey||'',
      _updated: new Date().toISOString()
    });
    addLog('✅ Risorse (persone & allocazioni) caricate.','info');
    const meta={lastUpload:new Date().toISOString(),cantieriCount:Object.keys(STATE).length,personeCount:RISORSE.persone.length};
    saveSyncMeta(meta);
    showToast('Upload completato ✓','success');
    render();
  }catch(err){
    addLog('❌ Errore upload: '+err.message,'err');
    showToast('Errore upload: '+err.message,'error');
  }
}

async function syncFromFirebase(){
  if(!FB_DB){ showToast('Collega prima Firebase','error'); return; }
  try{
    addLog('⬇ Inizio download da Firebase Realtime Database…','info');
    // Scarica cantieri
    const snapC = await FB_DB.ref('cantieri').get();
    if(snapC.exists()){
      const data = snapC.val();
      // Sovrascrive STATE con i dati dal cloud
      Object.keys(data).forEach(id=>{ STATE[id]=data[id]; });
      saveState(STATE);
      addLog(`✅ ${Object.keys(data).length} cantieri scaricati.`,'info');
    } else {
      addLog('ℹ Nessun cantiere trovato nel DB cloud.','warn');
    }
    // Scarica risorse
    const snapR = await FB_DB.ref('risorse').get();
    if(snapR.exists()){
      const rd = snapR.val();
      RISORSE.persone    = rd.persone     || [];
      RISORSE.allocazioni= rd.allocazioni || [];
      if(rd.groqApiKey)  RISORSE.groqApiKey = rd.groqApiKey;
      saveRisorseState();
      addLog(`✅ ${RISORSE.persone.length} persone, ${RISORSE.allocazioni.length} allocazioni scaricate.`,'info');
    } else {
      addLog('ℹ Nessun dato risorse trovato nel DB.','warn');
    }
    const meta={...loadSyncMeta(),lastDownload:new Date().toISOString()};
    saveSyncMeta(meta);
    showToast('Download completato ✓','success');
    render();
  }catch(err){
    addLog('❌ Errore download: '+err.message,'err');
    showToast('Errore download: '+err.message,'error');
  }
}

async function tryAutoConnect(){
  // 1. Se il FIREBASE_CONFIG nel file è stato compilato, ha la priorità
  //    → funziona su qualsiasi dispositivo senza configurazione manuale
  if(_FIREBASE_HARDCODED_READY){
    try{
      await loadFirebaseSDK();
      if(FB_APP) return;
      FB_APP = firebase.initializeApp(FIREBASE_CONFIG, 'sl_app_'+Date.now());
      FB_DB  = firebase.database(FB_APP);
      // Salva in localStorage così la sezione Database mostra i dati
      saveFbConfig(FIREBASE_CONFIG);
      addLog('🔄 Connessione automatica Firebase (config file).','info');
      _syncStatus='ok';
      updateSyncBadge();
      attachRealtimeListeners();
    }catch(e){ FB_APP=null; FB_DB=null; }
    return;
  }
  // 2. Fallback: configurazione salvata manualmente in localStorage
  const cfg = loadFbConfig();
  if(!cfg || !cfg.databaseURL) return;
  try{
    await loadFirebaseSDK();
    if(FB_APP) return;
    FB_APP = firebase.initializeApp(cfg, 'sl_app_'+Date.now());
    FB_DB  = firebase.database(FB_APP);
    addLog('🔄 Riconnessione automatica a Firebase (localStorage).','info');
    _syncStatus='ok';
    updateSyncBadge();
    attachRealtimeListeners();
  }catch(e){ FB_APP=null; FB_DB=null; }
}

// ============================================================
// REAL-TIME LISTENERS — aggiornamento automatico dal DB
// ============================================================

function attachRealtimeListeners(){
  if(!FB_DB || _realtimeListenersActive) return;
  _realtimeListenersActive = true;

  // ── Listener CANTIERI ─────────────────────────────────────
  FB_DB.ref('cantieri').on('value', snap => {
    // Ignora se siamo noi stessi a star scrivendo (evita loop upload→listen→upload)
    if(_syncStatus === 'syncing') return;
    if(!snap.exists()) return;
    const data = snap.val();
    if(!data) return;
    _applyingRemote = true;
    try{
      // Sovrascrive STATE con i dati ricevuti dal DB
      const keysRemote = Object.keys(data);
      keysRemote.forEach(id => { STATE[id] = data[id]; });
      // Rimuove cantieri cancellati da un altro dispositivo
      Object.keys(STATE).forEach(id => { if(!data[id]) delete STATE[id]; });
      localStorage.setItem('sl_cantieri', JSON.stringify(STATE));
      addLog('⬇ Real-time: cantieri aggiornati automaticamente ('+new Date().toLocaleTimeString('it-IT')+')','info');
    }catch(e){ addLog('⚠ Errore applicando aggiornamento cantieri: '+e.message,'err'); }
    _applyingRemote = false;
    render();
  }, err => {
    addLog('❌ Listener cantieri interrotto: '+err.message,'err');
    _realtimeListenersActive = false;
  });

  // ── Listener RISORSE ─────────────────────────────────────
  FB_DB.ref('risorse').on('value', snap => {
    if(_syncStatus === 'syncing') return;
    if(!snap.exists()) return;
    const rd = snap.val();
    if(!rd) return;
    _applyingRemote = true;
    try{
      RISORSE.persone     = rd.persone      || [];
      RISORSE.allocazioni = rd.allocazioni  || [];
      if(rd.groqApiKey) RISORSE.groqApiKey = rd.groqApiKey;
      // Salva in localStorage senza triggerare un nuovo upload su Firebase
      localStorage.setItem('sl_risorse', JSON.stringify({
        persone: RISORSE.persone,
        allocazioni: RISORSE.allocazioni,
        groqApiKey: RISORSE.groqApiKey||''
      }));
      addLog('⬇ Real-time: risorse aggiornate automaticamente ('+new Date().toLocaleTimeString('it-IT')+')','info');
    }catch(e){ addLog('⚠ Errore applicando aggiornamento risorse: '+e.message,'err'); }
    _applyingRemote = false;
    render();
  }, err => {
    addLog('❌ Listener risorse interrotto: '+err.message,'err');
    _realtimeListenersActive = false;
  });

  addLog('👂 Ascolto real-time attivato: l\'app si aggiorna automaticamente ad ogni modifica nel DB','info');
  _syncStatus = 'ok';
  updateSyncBadge();
}

function detachRealtimeListeners(){
  if(!FB_DB || !_realtimeListenersActive) return;
  try{
    FB_DB.ref('cantieri').off();
    FB_DB.ref('risorse').off();
  }catch(e){}
  _realtimeListenersActive = false;
  addLog('🔕 Ascolto real-time disattivato','info');
}
